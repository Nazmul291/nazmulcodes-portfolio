<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="nc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="64" height="64" rx="16" fill="#080c14" stroke="#1e293b" stroke-width="2"/>
  
  <!-- NazmulCodes Logo Symbol -->
  <g transform="translate(10, 10)" filter="url(#nc-glow)">
    <!-- Left Bracket < -->
    <path d="M 12 9 L 4 22 L 12 35" fill="none" stroke="url(#nc-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Code Slash / -->
    <line x1="26" y1="7" x2="18" y2="37" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 32 9 L 40 22 L 32 35" fill="none" stroke="url(#nc-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
